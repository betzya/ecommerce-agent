name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: ecommerce-backend (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce-backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ecommerce-backend/pom.xml
      - name: Compile
        run: mvn -B compile

  agent:
    name: agent (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Syntax check
        run: python -m compileall backend

  eval:
    name: eval gate (agent regression)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ecommerce
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ecommerce-backend/pom.xml
      - name: Start ecommerce backend
        working-directory: ecommerce-backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/ecommerce?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: |
          nohup mvn -B spring-boot:run > /tmp/ecommerce.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8081/actuator/health >/dev/null 2>&1; then
              echo "ecommerce 已就绪"; exit 0
            fi
            sleep 2
          done
          echo "ecommerce 启动超时"; tail -50 /tmp/ecommerce.log; exit 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install agent deps
        run: pip install -r agent-production/requirements.txt
      - name: Eval gate
        working-directory: agent-production/backend
        env:
          AGENT_OPENAI_API_KEY: ${{ secrets.AGENT_OPENAI_API_KEY }}
          ECOMMERCE_BASE_URL: http://localhost:8081
        run: python -m evals.gate
