services:
  agent-service:
    build: .
    container_name: agent
    env_file:
      - .env
    environment:
      ECOMMERCE_BASE_URL: http://ecommerce-service:8081
      AGENT_SERVICE_AUTH_TOKEN: ${AGENT_SERVICE_AUTH_TOKEN:-agent-service-token}
      AGENT_DB_PATH: /data/agent.db
    depends_on:
      ecommerce-service:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - agent-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ecommerce-service:
    build:
      context: ../ecommerce-backend
    container_name: ecommerce-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-ecommerce}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      SPRING_PROFILES_ACTIVE: course-debug
      AGENT_SERVICE_AUTH_TOKEN: ${AGENT_SERVICE_AUTH_TOKEN:-agent-service-token}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"

  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  agent-data:
  mysql-data:
